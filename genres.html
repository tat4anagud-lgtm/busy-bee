<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жанры — Busy Bee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="page-hero.css">
    <link rel="stylesheet" href="genres-style.css">
</head>
<body>

    <div class="page-shell">
    <script src="header.js"></script>

        <main class="ge-container">

            <nav class="breadcrumbs">
                <a href="index.html">Главная</a> <span>›</span>
                <span class="current">Жанры</span>
            </nav>

            <!-- HERO — общий .page-hero (page-hero.css), тот же размер,
                 что у «Авторов»/«Коллекций»/«Закладок»/«Уведомлений» -->
            <section class="ge-hero page-hero">
                <div class="page-hero-media">
                    <img src="images/backgrounds/hero-decor-genres.png" alt="">
                </div>

                <div class="ge-hero-left">
                    <h1 class="ge-title">Жанры</h1>
                    <div class="page-hero-ornament"><img src="images/icons/chapter-divider.png" alt=""></div>
                    <p class="ge-subtitle">Все истории на Busy Bee, собранные по жанрам — от дворцовых интриг до современной романтики.</p>

                    <div class="ge-search-box">
                        <img class="search-icon" src="images/icons/search.svg" alt="">
                        <input type="text" id="geSearchInput" placeholder="Найти жанр...">
                    </div>
                </div>
            </section>

            <!-- ФИЛЬТРЫ -->
            <section class="ge-toolbar">
                <div class="ge-chips" id="geChips" role="group" aria-label="Сортировка жанров">
                    <button type="button" class="ge-chip active" data-sort="default" aria-pressed="true">Все</button>
                    <button type="button" class="ge-chip" data-sort="popular" aria-pressed="false">По популярности</button>
                    <button type="button" class="ge-chip" data-sort="alphabet" aria-pressed="false">По алфавиту</button>
                </div>
                <span class="ge-count" id="geCount"></span>
            </section>

            <!-- СЕТКА ЖАНРОВ (рисует genres-script.js) -->
            <div class="ge-grid" id="geGrid"></div>

            <p class="ge-empty" id="geEmpty" hidden></p>

            <div class="ge-note">
                <img src="images/icons/bee-icon.svg" alt="">
                <p>Не нашли нужный жанр? Загляните в <a href="catalog.html">каталог</a> — там можно отфильтровать новеллы сразу по нескольким жанрам.</p>
            </div>

        </main>

    <script src="footer.js"></script>
    </div>

    <script src="script.js"></script>
    <script src="genres-script.js"></script>
</body>
</html>
