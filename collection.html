<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Коллекция — Busy Bee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="novels-grid.css">
    <link rel="stylesheet" href="collection-style.css">
</head>
<body>

    <div class="page-shell">
    <script src="header.js"></script>

        <main class="col-container">

            <!-- Показывается вместо страницы, если коллекции нет -->
            <p class="col-empty" id="colNotFound" hidden>Коллекция не найдена. Вернитесь на <a href="index.html">главную</a> и выберите коллекцию из списка.</p>

            <div id="colContent" hidden>

                <!-- БАННЕР -->
                <div class="col-banner">
                    <img id="colBanner" src="" alt="">
                </div>

                <!-- НАЗВАНИЕ, ОПИСАНИЕ, ПОДПИСКА -->
                <section class="col-head">
                    <div class="col-intro">
                        <h1 class="col-title" id="colTitle"></h1>
                        <div class="col-ornament"><img src="images/icons/chapter-divider.png" alt=""></div>
                        <p class="col-description" id="colDescription"></p>
                        <p class="col-meta" id="colMeta"></p>
                    </div>

                    <div class="col-follow-box">
                        <button type="button" class="col-follow" id="colFollow" aria-pressed="false">
                            <img src="images/icons/heart.svg" alt="" data-outline="images/icons/heart.svg" data-filled="images/icons/heart-filled.svg">
                            <span>Подписаться на коллекцию</span>
                        </button>
                        <span class="col-followers" id="colFollowers"></span>
                        <img class="col-bee" src="images/icons/bee-icon.svg" alt="">
                    </div>
                </section>

                <!-- ПАНЕЛЬ: количество, сортировка, вид (общий блок — см. novels-grid.css/js) -->
                <section class="ng-toolbar">
                    <h2 class="ng-count" id="colCount"></h2>

                    <div class="ng-toolbar-right">
                        <label class="ng-sort">
                            <span>Сортировка:</span>
                            <select id="colSort">
                                <option value="recent">Недавно добавленные</option>
                                <option value="rating">По рейтингу</option>
                                <option value="popular">Популярные</option>
                            </select>
                        </label>

                        <div class="ng-view" role="group" aria-label="Вид списка">
                            <span>Вид:</span>
                            <button type="button" class="ng-view-btn active" id="colViewGrid" aria-label="Сетка" aria-pressed="true">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                            </button>
                            <button type="button" class="ng-view-btn" id="colViewList" aria-label="Список" aria-pressed="false">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- НОВЕЛЛЫ (карточки рисует общий novels-grid.js) -->
                <div class="ng-grid" id="colGrid"></div>

                <div class="ng-more-wrap">
                    <button type="button" class="ng-more" id="colMore" hidden>
                        <span>Показать ещё</span>
                        <img src="images/icons/chevron-down.svg" alt="">
                    </button>
                </div>

                <!-- ОБ ЭТОЙ КОЛЛЕКЦИИ -->
                <section class="col-about" id="colAbout" hidden>
                    <div class="col-about-image">
                        <img id="colAboutImage" src="" alt="">
                    </div>
                    <div class="col-about-text">
                        <h2 class="col-about-title" id="colAboutTitle"></h2>
                        <div class="col-ornament"><img src="images/icons/chapter-divider.png" alt=""></div>
                        <div id="colAboutText"></div>
                    </div>
                </section>

            </div>
        </main>

    <script src="footer.js"></script>
    </div>

    <script src="script.js"></script>
    <script src="novels-grid.js"></script>
    <script src="collection-script.js"></script>
</body>
</html>
