<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторы — Busy Bee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="page-hero.css">
    <link rel="stylesheet" href="authors-style.css">
</head>
<body>

    <div class="page-shell">
    <script src="header.js"></script>

        <main class="au-container">

            <!-- Хлебные крошки вынесены за пределы баннера — общий
                 .breadcrumbs из style.css, как на author.html/novel.html -->
            <nav class="breadcrumbs">
                <a href="index.html">Главная</a> <span>›</span>
                <span class="current">Авторы</span>
            </nav>

            <!-- HERO — общий .page-hero (page-hero.css): фото на всю
                 плашку с растушёвкой слева, фиксированная высота 280px,
                 тот же размер, что у «Закладок»/«Коллекций»/«Уведомлений» -->
            <section class="au-hero page-hero">
                <div class="page-hero-media">
                    <img src="images/backgrounds/authors-hero.png" alt="">
                </div>

                <div class="au-hero-left">
                    <h1 class="au-title">Авторы</h1>
                    <p class="au-subtitle">Переводчики и писатели, чьи истории живут на Busy Bee.</p>

                    <div class="au-search-box">
                        <img class="search-icon" src="images/icons/search.svg" alt="">
                        <input type="text" id="auSearchInput" placeholder="Найти автора по имени...">
                    </div>
                </div>
            </section>

            <!-- ФИЛЬТРЫ -->
            <section class="au-toolbar">
                <div class="au-chips" id="auChips" role="group" aria-label="Сортировка авторов">
                    <button type="button" class="au-chip active" data-sort="default" aria-pressed="true">Все</button>
                    <button type="button" class="au-chip" data-sort="popular" aria-pressed="false">По популярности</button>
                    <button type="button" class="au-chip" data-sort="alphabet" aria-pressed="false">По алфавиту</button>
                </div>
                <span class="au-count" id="auCount"></span>
            </section>

            <!-- СЕТКА АВТОРОВ (рисует authors-script.js) -->
            <div class="au-grid" id="auGrid"></div>

            <p class="au-empty" id="auEmpty" hidden></p>

            <div class="au-note">
                <img src="images/icons/bee-icon.svg" alt="">
                <p>Не нашли своего любимого автора? <a href="catalog.html">Загляните в каталог</a> — возможно, его новеллы уже переводит кто-то из наших переводчиков.</p>
            </div>

        </main>

    <script src="footer.js"></script>
    </div>

    <!-- МОБИЛЬНАЯ НАВИГАЦИЯ — вне .page-shell (см. комментарий в mobile-nav.js) -->
    <script src="mobile-nav.js"></script>

    <script src="script.js"></script>
    <script src="authors-script.js"></script>
</body>
</html>
