<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коллекции — Busy Bee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="page-hero.css">
    <link rel="stylesheet" href="collections-style.css">
</head>
<body>

    <div class="page-shell">
    <script src="header.js"></script>

        <main class="cl-container">

            <nav class="breadcrumbs">
                <a href="index.html">Главная</a> <span>›</span>
                <span class="current">Коллекции</span>
            </nav>

            <!-- HERO -->
            <section class="cl-hero page-hero">
                <div class="cl-hero-media page-hero-media">
                    <img src="images/backgrounds/hero-decor-collections.png" alt="">
                </div>

                <div class="cl-hero-left">
                    <h1 class="cl-title">Коллекции</h1>
                    <div class="page-hero-ornament"><img src="images/icons/chapter-divider.png" alt=""></div>
                    <p class="cl-subtitle">Подборки историй по настроению и темам: выберите коллекцию и найдите то, что хочется читать сегодня.</p>

                    <div class="cl-search-box">
                        <img class="search-icon" src="images/icons/search.svg" alt="">
                        <input type="text" id="clSearchInput" placeholder="Поиск по коллекциям...">
                    </div>
                </div>
            </section>

            <!-- КОЛЛЕКЦИЯ НЕДЕЛИ (рисует collections-script.js) -->
            <section class="cl-featured" id="clFeatured" hidden></section>

            <!-- ФИЛЬТРЫ -->
            <section class="cl-toolbar">
                <div class="cl-chips" id="clChips" role="group" aria-label="Фильтр коллекций">
                    <button type="button" class="cl-chip active" data-filter="all" aria-pressed="true">Все</button>
                    <button type="button" class="cl-chip" data-filter="popular" aria-pressed="false">Популярные</button>
                    <button type="button" class="cl-chip" data-filter="new" aria-pressed="false">Новые</button>
                    <button type="button" class="cl-chip" data-filter="followed" aria-pressed="false">Мои подписки</button>
                </div>
                <span class="cl-count" id="clCount"></span>
            </section>

            <!-- СЕТКА КОЛЛЕКЦИЙ -->
            <div class="cl-grid" id="clGrid"></div>

            <p class="cl-empty" id="clEmpty" hidden></p>

            <div class="cl-note">
                <img src="images/icons/bee-icon.svg" alt="">
                <p>Не нашли подходящую? Загляните в <a href="catalog.html">каталог</a> — там все новеллы с фильтрами по жанрам.</p>
            </div>

        </main>

    <script src="footer.js"></script>
    </div>

    <script src="script.js"></script>
    <script src="collections-script.js"></script>
</body>
</html>
