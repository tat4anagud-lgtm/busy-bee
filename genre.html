<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Жанр — Busy Bee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="novels-grid.css">
    <link rel="stylesheet" href="genre-style.css">
</head>
<body>

    <div class="page-shell">
    <script src="header.js"></script>

        <main class="gn-container">

            <!-- Фотобаннер — только если для жанра есть картинка (см. GENRE_BANNERS
                 в genre-script.js); иначе видна только gn-hero ниже -->
            <div class="gn-banner" id="gnBanner" hidden>
                <img id="gnBannerImg" src="" alt="">
            </div>

            <!-- HERO -->
            <section class="gn-hero" id="gnHero">
                <div class="gn-hero-left">
                    <nav class="gn-breadcrumbs" aria-label="Навигация">
                        <a href="index.html">Главная</a>
                        <span aria-hidden="true">›</span>
                        <a href="genres.html">Жанры</a>
                        <span aria-hidden="true">›</span>
                        <span id="gnBreadcrumbCurrent"></span>
                    </nav>

                    <h1 class="gn-title" id="gnTitle"></h1>
                    <div class="gn-ornament"><img src="images/icons/chapter-divider.png" alt=""></div>
                    <p class="gn-subtitle" id="gnSubtitle"></p>
                </div>

                <div class="gn-hero-decor" id="gnHeroDecor">
                    <img src="images/backgrounds/glossary-hero-decor.png" alt="">
                </div>
            </section>

            <!-- Показывается вместо страницы, если в адресе не указан жанр -->
            <p class="gn-empty" id="gnNotFound" hidden>Такого жанра нет. Вернитесь в <a href="genres.html">жанры</a> или <a href="catalog.html">каталог</a>.</p>

            <div id="gnContent" hidden>

                <!-- ПАНЕЛЬ: количество, сортировка, вид (общий блок — см. novels-grid.css/js) -->
                <section class="ng-toolbar">
                    <h2 class="ng-count" id="gnCount"></h2>

                    <div class="ng-toolbar-right">
                        <label class="ng-sort">
                            <span>Сортировка:</span>
                            <select id="gnSort">
                                <option value="updated">По обновлению</option>
                                <option value="rating">По рейтингу</option>
                                <option value="popular">Популярные</option>
                            </select>
                        </label>

                        <div class="ng-view" role="group" aria-label="Вид списка">
                            <span>Вид:</span>
                            <button type="button" class="ng-view-btn active" id="gnViewGrid" aria-label="Сетка" aria-pressed="true">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                            </button>
                            <button type="button" class="ng-view-btn" id="gnViewList" aria-label="Список" aria-pressed="false">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- НОВЕЛЛЫ (карточки рисует общий novels-grid.js) -->
                <div class="ng-grid" id="gnGrid"></div>

                <div class="ng-more-wrap">
                    <button type="button" class="ng-more" id="gnMore" hidden>
                        <span>Показать ещё</span>
                        <img src="images/icons/chevron-down.svg" alt="">
                    </button>
                </div>

            </div>
        </main>

    <script src="footer.js"></script>
    </div>

    <!-- МОБИЛЬНАЯ НАВИГАЦИЯ — вне .page-shell (см. комментарий в mobile-nav.js) -->
    <script src="mobile-nav.js"></script>

    <script src="script.js"></script>
    <script src="novels-grid.js"></script>
    <script src="genre-script.js"></script>
</body>
</html>
